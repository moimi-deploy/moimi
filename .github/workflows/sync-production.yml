name: 배포 브랜치 동기화

on:
  schedule:
    - cron: '17 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-deployment
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 배포 저장소 체크아웃
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 원본 저장소 브랜치 가져오기
        run: |
          git remote add upstream https://github.com/inu-appcenter/INU-TeamFlow-web.git
          git fetch upstream main develop

      - name: main 브랜치 동기화
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          MAIN_COMMIT=$(git ls-remote origin refs/heads/main | cut -f1)

          if [ "$UPSTREAM_COMMIT" = "$MAIN_COMMIT" ]; then
            echo "main 브랜치가 이미 최신 상태입니다."
          else
            echo "main 브랜치를 원본과 동기화합니다."
            git push origin \
              "$UPSTREAM_COMMIT:refs/heads/main" \
              --force
          fi

      - name: develop 브랜치 동기화
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/develop)
          DEVELOP_COMMIT=$(git ls-remote origin refs/heads/develop | cut -f1)

          if [ "$UPSTREAM_COMMIT" = "$DEVELOP_COMMIT" ]; then
            echo "develop 브랜치가 이미 최신 상태입니다."
          else
            echo "develop 브랜치를 원본과 동기화합니다."
            git push origin \
              "$UPSTREAM_COMMIT:refs/heads/develop" \
              --force
          fi